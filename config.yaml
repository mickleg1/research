      - "https://www.fanduel.com/sportsbook"
      - "https://apps.apple.com/us/app/fanduel-sportsbook-casino/id1275517595"
      - "https://play.google.com/store/apps/details?id=com.fanduel.sportsbook"
    kalshi:
      - "https://kalshi.com/"
      - "https://kalshi.com/markets"
      - "https://apps.apple.com/us/app/kalshi/id1641176216"
      - "https://play.google.com/store/apps/details?id=com.kalshi.app"
    polymarket:
