contact_email: "research@example.edu"
user_agent: "sportsbook-prediction-market-collector/1.0 (contact: research@example.edu)"
request_rate_limit_per_sec: 1.0
request_timeout_sec: 30

prediction_markets:
  kalshi:
    base_url: "https://external-api.kalshi.com/trade-api/v2"
    markets_endpoint: "/markets"
    default_params:
      limit: 500
      status: "open"
  polymarket:
    gamma_base_url: "https://gamma-api.polymarket.com"
    data_base_url: "https://data-api.polymarket.com"
    markets_endpoint: "/markets/keyset"
    default_params:
      limit: 100
      active: true
      closed: false

sportsbook_records:
  states:
    NJ:
      regulator: "New Jersey Division of Gaming Enforcement"
      report_index_urls:
        - "https://www.nj.gov/oag/ge/financials.html"
      operator_aliases:
        "DraftKings": "draftkings"
        "DraftKings Sportsbook": "draftkings"
        "DK": "draftkings"
        "FanDuel": "fanduel"
        "FanDuel Sportsbook": "fanduel"
        "BetMGM": "betmgm"
        "Bet MGM": "betmgm"
    PA:
      regulator: "Pennsylvania Gaming Control Board"
      report_index_urls:
        - "https://gamingcontrolboard.pa.gov/?p=financial-reports"
      operator_aliases:
        "DraftKings": "draftkings"
        "FanDuel": "fanduel"
        "BetMGM": "betmgm"
    NY:
      regulator: "New York State Gaming Commission"
      report_index_urls:
        - "https://gaming.ny.gov/gaming/sportswagering.php"
      operator_aliases:
        "DraftKings": "draftkings"
        "FanDuel": "fanduel"
        "BetMGM": "betmgm"

ux_features:
  platforms:
    - draftkings
    - fanduel
    - kalshi
    - polymarket
  source_pages:
